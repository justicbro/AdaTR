target: /home/lin/jupyter/tensor/reconstruction/data/output.png
base_config: configs/base_configs/2d_base_config.yaml

use_wandb: 0

data: imagenet # {cifar10, imagenet}
model: QTT # {QTT, Tucker, CP}
attack: clean # pipeline+{pgdeot, AA} to attack the whole pipeline

lr: 0.008
loss_fn_str: Huber # {L1, L2, Huber}

payload: 3
payload_position: first_core

subset_size: 512 # number of test images
num_iterations: 1000
max_batch_size: 1024

seed: 42

init_reso: 16
end_reso: 256

iterations_for_upsampling:
  - 25
  - 50
  - 100
  - 200

max_rank: 200 # 20 for cifar10, 200 for imagenet

subset_to_train_on: 0.75
noise_std: 0.
noise_type: None #gaussian
noise_mean: 0

lr_decay_factor: 0.9
lr_decay_factor_until_next_upsampling: 0.1
warmup_steps: 5

log_every: 5
show_end_results_locally: 0
save_end_results_locally: 0
plot_upsampling: 0
calculate_psnr_while_training: 0

save_training_images: 0
use_tqdm: 0
wandb_limited_logging: 0
compute_reconstruction: 0